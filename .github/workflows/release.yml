name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  validate:
    name: Validate Tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Tag is on main branch
        run: |
          git fetch origin main:main
          TAG_COMMIT=$(git rev-parse HEAD)
          if git merge-base --is-ancestor $TAG_COMMIT main; then
            echo "✅ Tag is on main branch. Proceeding with release."
          else
            echo "❌ Tag is NOT on main branch. Skipping release build."
            exit 1
          fi

  build-and-release:
    name: Build and Release
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run GoReleaser Cross
        uses: docker://goreleaser/goreleaser-cross:v1.25.11
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CGO_ENABLED: 1

