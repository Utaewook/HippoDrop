name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  test:
    name: Run Tests & Vet
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Install SQLite dev headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev

      - name: Run go vet
        run: go vet ./...

      - name: Run Tests
        env:
          CGO_ENABLED: 1
        run: go test -v -race -coverprofile=coverage.out ./...
